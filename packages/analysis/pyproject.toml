[project]
name = "lantern-analysis"
version = "0.1.0"
description = "Parsing, rule matching, taint tracking and data-flow graph construction."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lantern-registry",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "semgrep>=1.90",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern_analysis"]

[tool.uv.sources]
lantern-registry = { workspace = true }
