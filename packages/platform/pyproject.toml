[project]
name = "lantern-platform"
version = "0.1.0"
description = "Shared service layer for the Lantern API and worker: settings, storage, queue, GitHub App client, crypto, egress policy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lantern-analysis",
    "lantern-decisions",
    "lantern-report",
    "cryptography>=43",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
]

[tool.uv.sources]
lantern-analysis = { workspace = true }
lantern-decisions = { workspace = true }
lantern-report = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern_platform"]
