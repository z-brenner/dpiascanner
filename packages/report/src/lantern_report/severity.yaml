# Finding severity. Start from the category's base level, apply every modifier whose
# condition holds (each raises or lowers one level), clamp to [informational, critical].
# Unreachable findings are always informational.
#
# Conditions:
#   special_category        a source in the finding has special_category_art9 = yes
#   relates_to_minor        a source has relates_to_minor = yes
#   sensitive_data          a data category is government_id, health, biometric,
#                           financial, precise_location, or credentials (not counted again
#                           when special_category already applied)
#   risky_destination       the destination class is ad_tech, unknown_third_party,
#                           ai_model_provider, or cross_border
#   low_identifiability     the lowest identifiability along the path is 2 or less
#   unreachable             no path in the finding is reachable from an entry point
version: severity-v1
levels: [informational, low, medium, high, critical]
base:
  personal_data_to_third_party: medium
  special_category_processing: medium
  reversible_obfuscation: high
  indefinite_retention: medium
  logging_of_personal_data: medium
  cross_border_ambiguity: medium
  sale_or_share_candidate: high
  unresolved_flow: medium
  unreachable_flow: informational
  mitigated_partially: medium
  personal_data_processing: low
modifiers:
  - {when: special_category, change: 1}
  - {when: relates_to_minor, change: 1}
  - {when: sensitive_data, change: 1}
  - {when: risky_destination, change: 1}
  - {when: low_identifiability, change: -1}
never_raise: [unreachable_flow]
