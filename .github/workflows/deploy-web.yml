name: deploy-web

# Deploys apps/web to Cloudflare Workers after CI passes on main, or on demand. Does nothing
# until the repository has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; see
# docs/deploy-cloudflare.md. It builds the public demo (build:cf, with the demo notice).
# Repository variables: LANTERN_API_ORIGIN (passed to the Worker as API_ORIGIN), and
# LANTERN_OPERATOR_CONTACT and LANTERN_BACKEND_HOST (shown in the demo's data notice).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run's branch filter matches the triggering run's branch name, which a fork's pull
    # request can also call "main". Deploy only runs CI made for a push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
        with:
          # The commit CI passed on, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        if: steps.creds.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and deploy
        if: steps.creds.outputs.present == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: ${{ vars.LANTERN_API_ORIGIN }}
          VITE_OPERATOR_CONTACT: ${{ vars.LANTERN_OPERATOR_CONTACT }}
          VITE_BACKEND_HOST: ${{ vars.LANTERN_BACKEND_HOST }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm run build:cf
          args=()
          if [ -n "$API_ORIGIN" ]; then args+=(--var "API_ORIGIN:$API_ORIGIN"); fi
          pnpm exec wrangler deploy "${args[@]}"
