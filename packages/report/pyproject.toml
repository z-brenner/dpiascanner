[project]
name = "lantern-report"
version = "0.1.0"
description = "Findings assembly, DPIA assembly, statute mapping, and renderers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lantern-analysis",
    "lantern-decisions",
    "pyyaml>=6.0",
]

[tool.uv.sources]
lantern-analysis = { workspace = true }
lantern-decisions = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern_report"]
