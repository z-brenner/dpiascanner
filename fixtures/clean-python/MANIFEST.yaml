# False-positive control. This fixture processes no personal data, so the analyzer must
# report zero source-to-sink paths and zero findings.
#
# It deliberately contains identifiers that a naive lexicon would flag. Each trap names
# the reason it is not personal data.
schema_version: 1
fixture: clean-python
language: python
flows: []
traps:
  - {file: app/models.py, snippet: "name: Mapped[str]", reason: "Product name, not a person's name."}
  - {file: app/models.py, snippet: "condition: Mapped[str]", reason: "Product condition (new, used, refurbished), not a health condition."}
  - {file: app/models.py, snippet: "country_of_origin", reason: "Where a product was made, not a person's location."}
  - {file: app/main.py, snippet: "@app.get(\"/healthz\")", reason: "Service health check. The word health is not health data."}
  - {file: app/routes/products.py, snippet: "request.headers.get(\"x-request-id\"", reason: "A request correlation id generated by infrastructure, not a user identifier."}
  - {file: app/fx.py, snippet: "httpx.get(", reason: "Third-party call carrying only currency codes."}
  - {file: app/observability.py, snippet: "sentry_sdk.init(", reason: "A registry SDK is initialized, but no personal data exists for it to capture."}
notes: >-
  Server access logs record client IP addresses, which are personal data. The Dockerfile runs
  uvicorn with --no-access-log so the fixture is genuinely clean at runtime. Static analysis of
  application code does not model the server's own access log.
