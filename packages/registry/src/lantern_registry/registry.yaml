                 recordCustomEvent, noticeError, addCustomAttribute, addCustomAttributes, setUserId, recordLogEvent]
    setup_calls: [initialize, register_application, shutdown_agent, agent]
    auto_collected:
      - Transaction traces, error traces with messages, and request attributes. Request headers and parameters are excluded unless configured.
      - Browser agent collects page views, user agent, and page URLs.
    endpoints:
