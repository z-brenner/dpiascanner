      - {host: collector.eu01.nr-data.net, region: EU}
    processor_claims:
      gdpr_processor: true
      cpra_service_provider: true
      notes: New Relic's data processing terms are incorporated into its general terms; the dpa_url links to the terms page that references them.
    dpa_url: https://newrelic.com/termsandconditions/terms
    mitigation_hooks:
      - {name: high_security, kind: flag, languages: [python, typescript],
         description: Account-level high security mode disables collection of request parameters and message bodies.}
      - {name: strip_exception_messages, kind: flag, languages: [python, typescript],
         description: Removes exception messages from error traces.}
    last_reviewed: 2026-09-28
    reviewed_by: initial draft, not legal review

