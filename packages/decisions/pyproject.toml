[project]
name = "lantern-decisions"
version = "0.1.0"
description = "DecisionProvider interface, providers, and versioned question sets."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern_decisions"]
