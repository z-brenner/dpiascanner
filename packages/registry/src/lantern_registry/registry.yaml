# Katz third-party SDK registry.
#
# Entries are evidence, not verdicts. The analyzer uses them to create sink nodes with known
# semantics and to detect mitigation hooks; the decision layer still classifies what the
# caller actually passed. Vendor claims are recorded as claims, with a link to the terms.
#
# Review status: every entry below is an initial draft compiled from vendor documentation
# known to the authors, not a legal review. `reviewed_by` says so. URLs are checked monthly
# by `python -m lantern_registry.validate --check-urls`. Before relying on an entry in a
# DPIA, a human must confirm the processor claim and the regions against the linked terms.
#
# Matching order matters: the first entry whose `imports` match wins, so narrower entries
# (firebase-analytics) come before broader ones (firebase).
version: "2026.09"
schema_version: 1
entries:
  # ---------------------------------------------------------------- error reporting and observability
  - id: sentry
    vendor: Functional Software, Inc. (Sentry)
    packages:
      pypi: [sentry-sdk, raven]
      npm: ["@sentry/*", raven-js]
    imports:
      python: [sentry_sdk, raven]
      typescript: ["@sentry/*", raven-js]
    destination_class: log
    sink_calls: [capture_exception, capture_message, capture_event, set_user, set_context, set_extra, set_tag, add_breadcrumb,
                 captureException, captureMessage, captureEvent, setUser, setContext, setExtra, setTag, setTags, addBreadcrumb]
    setup_calls: [init, flush, close, configure_scope, push_scope, start_transaction, startSpan, setupExpressErrorHandler]
    event_paths:
      set_user: user
      setUser: user
      capture_exception: exception
      captureException: exception
      capture_message: message
      captureMessage: message
      set_context: contexts
      setContext: contexts
      set_extra: extra
      setExtra: extra
      set_tag: tags
      setTag: tags
      setTags: tags
      add_breadcrumb: breadcrumbs
      addBreadcrumb: breadcrumbs
    captures_unhandled_exceptions: true
    auto_collected:
      - Exception type, message, and stack trace for captured and unhandled errors.
      - "Stack-frame local variables (Python include_local_variables defaults to true). Observed in Katz fixtures with sentry-sdk 2.71: the full request model, including email and date of birth, was sent with send_default_pii=False."
      - "HTTP request data for framework integrations: URL, method, headers with a default denylist, and request body (Python max_request_body_size defaults to medium). Observed: the JSON request body was sent with send_default_pii=False."
      - Breadcrumbs from logging calls and outgoing HTTP requests.
      - With send_default_pii or sendDefaultPii enabled, user IP address, cookies, and user identity from the framework's auth layer.
    endpoints:
      - {host: "*.ingest.sentry.io", region: US}
      - {host: "*.ingest.us.sentry.io", region: US}
      - {host: "*.ingest.de.sentry.io", region: "EU (Germany)"}
    processor_claims:
      gdpr_processor: true
      cpra_service_provider: true
      notes: Sentry's DPA describes Sentry as processor and service provider for customer data.
    dpa_url: https://sentry.io/legal/dpa/
    mitigation_hooks:
      - {name: before_send, kind: event_scrubber, languages: [python], config_call: init, argument: before_send,
         description: Callback that can edit or drop each event before it is sent.}
      - {name: beforeSend, kind: event_scrubber, languages: [typescript], config_call: init, argument: beforeSend,
         description: Callback that can edit or drop each event before it is sent.}
      - {name: send_default_pii, kind: flag, languages: [python], config_call: init, argument: send_default_pii,
         description: When false, the SDK omits IP, cookies and auth user data. It does not stop request bodies or local variables.}
      - {name: sendDefaultPii, kind: flag, languages: [typescript], config_call: init, argument: sendDefaultPii,
         description: When false, the SDK omits IP and cookies. It does not stop request data or error messages.}
      - {name: include_local_variables, kind: flag, languages: [python], config_call: init, argument: include_local_variables,
         description: Set to false to stop sending stack-frame locals.}
      - {name: max_request_body_size, kind: flag, languages: [python], config_call: init, argument: max_request_body_size,
         description: Set to "never" to stop sending request bodies.}
    last_reviewed: 2026-09-28
    reviewed_by: initial draft, not legal review
    references:
      - https://docs.sentry.io/platforms/python/data-management/data-collected/
      - https://docs.sentry.io/platforms/javascript/guides/node/data-management/data-collected/

  - id: datadog
    vendor: Datadog, Inc.
    packages:
      pypi: [datadog, ddtrace, datadog-api-client]
      npm: [dd-trace, "@datadog/browser-rum", "@datadog/browser-logs", "@datadog/datadog-api-client", datadog-metrics]
    imports:
      python: [datadog, ddtrace, datadog_api_client]
      typescript: [dd-trace, "@datadog/*", datadog-metrics]
    destination_class: log
    sink_calls: [log, info, warn, warning, error, debug, set_tag, setTag, setUser, setGlobalContextProperty, addAction, addError,
                 send, submit_log, event, gauge, increment]
    setup_calls: [init, initialize, patch, patch_all, tracer, start, configure]
    auto_collected:
      - APM traces with span names, resource names, URLs, and tags. Query strings are obfuscated by a default regex; request bodies are not collected by default.
      - Log lines sent by the logs integration, including anything the application logs.
      - "Browser RUM: IP address, geolocation derived from it, user agent, page URLs and actions; Session Replay if enabled (privacy level defaults to mask for inputs in recent SDKs)."
    endpoints:
      - {host: datadoghq.com, region: US1}
      - {host: us3.datadoghq.com, region: US3}
      - {host: us5.datadoghq.com, region: US5}
      - {host: datadoghq.eu, region: "EU1 (Germany)"}
      - {host: ap1.datadoghq.com, region: "AP1 (Japan)"}
      - {host: ddog-gov.com, region: US1-FED}
    processor_claims:
      gdpr_processor: true
      cpra_service_provider: true
      notes: Datadog's DPA describes Datadog as processor and service provider.
    dpa_url: https://www.datadoghq.com/legal/data-processing-addendum/
    mitigation_hooks:
      - {name: defaultPrivacyLevel, kind: flag, languages: [typescript], config_call: init, argument: defaultPrivacyLevel,
         description: "RUM Session Replay masking; mask hides all text and inputs."}
      - {name: beforeSend, kind: event_scrubber, languages: [typescript], config_call: init, argument: beforeSend,
         description: Browser RUM and logs callback that can edit or drop events.}
      - {name: sensitive_data_scanner, kind: config, languages: [python, typescript],
         description: Server-side scanning rules configured in the Datadog UI; invisible to code analysis.}
    last_reviewed: 2026-09-28
    reviewed_by: initial draft, not legal review

