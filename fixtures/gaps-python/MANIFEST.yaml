# Patterns found on real repositories (full-stack-fastapi-template). Added fixture-first: a
# pattern the analyzer does not handle yet goes in with `known_gap` set, which the benchmark
# reports and the CI gate skips. When the analyzer handles it, remove `known_gap` and the gate
# covers it like any other flow.
# Never shown to the analyzer or to the LLM baseline.
schema_version: 1
fixture: gaps-python
language: python
flows:
  - id: G01
    description: Email address and name from the signup body sent to an SMTP relay with smtplib.
    sources:
      - {file: app/routes.py, line: 21, snippet: "user_in: UserCreate", field: email, expected_data_category: contact}
      - {file: app/routes.py, line: 21, snippet: "user_in: UserCreate", field: full_name, expected_data_category: identifier}
    sink: {file: app/mailer.py, line: 15, snippet: "smtp.send_message(message)", expected_sink_class: communications}
    expected_transformation: passthrough
    reachable: true
    resolution: resolved
    expected_findings: [personal_data_to_third_party]
    forbidden_findings: [unresolved_flow]

  - id: G02
    description: Signup body written through a session injected with an Annotated[Session, Depends()] alias.
    sources:
      - {file: app/routes.py, line: 21, snippet: "user_in: UserCreate", field: email, expected_data_category: contact}
      - {file: app/routes.py, line: 21, snippet: "user_in: UserCreate", field: full_name, expected_data_category: identifier}
    sink: {file: app/routes.py, line: 23, snippet: "session.add(user)", expected_sink_class: first_party_store}
    expected_transformation: passthrough
    reachable: true
    resolution: resolved
    retention: {has_expiry: false}
    expected_findings: [indefinite_retention]
    forbidden_findings: [unresolved_flow, personal_data_to_third_party]

  - id: G03
    description: Subscriber emails read with SQLModel's session.exec(select(...)) and written to a log line.
    sources:
      - {file: app/routes.py, line: 31, snippet: "session.exec(select(Subscriber))", field: email, expected_data_category: contact}
    sink: {file: app/routes.py, line: 32, snippet: "logger.info(", expected_sink_class: log}
    expected_transformation: passthrough
    reachable: true
    resolution: resolved
    expected_findings: [logging_of_personal_data]
    forbidden_findings: [unresolved_flow]

  - id: G04
    description: >-
      Member row read through a select statement bound to a variable and filtered with
      .where(), from a table=True class that inherits its columns from a non-table SQLModel
      base, then written to a log line (the shape of crud.get_user_by_email in
      full-stack-fastapi-template).
    sources:
      - {file: app/routes.py, line: 39, snippet: "session.exec(statement)", field: full_name, expected_data_category: identifier}
    sink: {file: app/routes.py, line: 41, snippet: "logger.info(", expected_sink_class: log}
    expected_transformation: passthrough
    reachable: true
    resolution: resolved
    expected_findings: [logging_of_personal_data]
    forbidden_findings: [unresolved_flow]
